reconcile:
  name: Reconcile Alexa exposure
  description: Recompute the desired Alexa-exposed set from the policy and apply the difference now. Stale/ghost records are always cleaned; a large number of LIVE removals is held by the fail-safe unless you raise max_removals for this run.
  fields:
    max_removals:
      name: Max live removals (this run)
      description: One-shot override of the safety threshold on removing entities that still exist. Use a high value for the initial cleanup after reviewing a preview; omit for the safe default.
      example: 50
      selector:
        number:
          min: 0
          max: 1000

preview:
  name: Preview Alexa exposure changes
  description: Dry run — compute what would be exposed/unexposed to Alexa and report it (log + a notification) without changing anything. Use this before the first apply to confirm it's a near-no-op against your current set.

alexa_rooms:
  name: List Alexa rooms (experimental)
  description: EXPERIMENTAL, read-only — lists the account's Alexa device groups (rooms) by borrowing the Alexa Media Player or Alexa Devices session. Requires one of those installed and logged in. Makes no changes.

room_op:
  name: Apply one Alexa room op (experimental)
  description: EXPERIMENTAL — create, rename, or delete a single Alexa room. Called per-op by the panel so it can show per-op status. Requires an Alexa session (Alexa Devices or Alexa Media Player).
  fields:
    action:
      name: Action
      required: true
      selector:
        select:
          options: [create, rename, delete]
    id:
      name: Room id (rename/delete)
      selector:
        text:
    name:
      name: Name (create/rename)
      selector:
        text:

move_device:
  name: Move a device between Alexa rooms (experimental)
  description: EXPERIMENTAL — move one Alexa endpoint out of its current room and into another (either side optional). Called per-move by the panel.
  fields:
    endpoint_id:
      name: Endpoint id
      required: true
      selector:
        text:
    from:
      name: From room id
      selector:
        text:
    to:
      name: To room id
      selector:
        text:

assign_preview:
  name: Preview device→room assignments (experimental)
  description: EXPERIMENTAL, read-only — reports which exposed HA devices would snap into their HA-area's Alexa room (matched by name), plus how many endpoints didn't match. Makes no changes.

forget_endpoint:
  name: Remove one Alexa smart-home endpoint (experimental)
  description: EXPERIMENTAL — remove a single Alexa smart-home endpoint by id (a duplicate or stray). Called per-op by the panel's cleanup list.
  fields:
    endpoint_id:
      name: Endpoint id
      required: true
      selector:
        text:

set_preferred_speaker:
  name: Set a room's preferred speaker (experimental)
  description: EXPERIMENTAL — choose which speaker in an Alexa room answers "play music here" (brand-agnostic — an Echo, a Sonos, whatever is in the room). Called per-room by the panel.
  fields:
    room_id:
      name: Room id
      required: true
      selector:
        text:
    endpoint_id:
      name: Speaker endpoint id
      required: true
      selector:
        text:

place_in_area:
  name: Place a device in its Home Assistant area's room (experimental)
  description: EXPERIMENTAL — put one device into the Alexa room matching a Home Assistant area, creating that room first if it doesn't exist yet (dependencies first). Called per-device by the panel.
  fields:
    endpoint_id:
      name: Endpoint id
      required: true
      selector:
        text:
    area:
      name: Home Assistant area name
      required: true
      selector:
        text:
    from:
      name: From room id
      selector:
        text:

alexa_devices:
  name: Clean up Alexa device registrations (experimental)
  description: EXPERIMENTAL — lists your Amazon device registrations and flags the likely junk (companion-app entries, duplicates). Default is a preview that changes nothing; apply true removes the flagged ones. Protected devices are never touched.
  fields:
    apply:
      name: Apply
      description: Off = preview only (default). On = act on the flagged registrations.
      default: false
      selector:
        boolean:
    limit:
      name: Max per call
      description: How many to act on in one call. Small by default; omit or 0 for all.
      example: 5
      selector:
        number:
          min: 0
          max: 500
    endpoint_ids:
      name: Specific endpoint ids
      description: Act on exactly these (the panel uses this); overrides the flagged set.
      selector:
        object:

room_speakers:
  name: Report room preferred speakers (experimental)
  description: EXPERIMENTAL, read-only — returns each Alexa room's current preferred ("play music here") speaker, its play-music targeting, the speaker-capable candidates, and all members with their categories. Returns a response (use return_response). Makes no changes.
